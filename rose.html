<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <title>Happy Rose Day 🌹</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 45px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      max-width: 420px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
      font-size: 32px;
    }

    p {
      color: #444;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      background: #e63946;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #c92a36;
      transform: scale(1.05);
    }

    .rose {
      position: fixed;
      font-size: 26px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    #secret {
      margin-top: 20px;
      font-weight: bold;
      color: #e63946;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Happy Rose Day Kanna🌹</h1>
    <p>
      This rose is a small reminder of how special you are to me.
      You make my days brighter just by being by myside. 
      This rose carries my feelings for you pure, deep, and true.
     No words will ever be enough to tell you how much you mean to me.❤️  
    </p>
    <audio controls autoplay>
    <source src="nee chitram choosi.mp3">
  </audio>

    <button onclick="showRoseLove()">Ee Rose neekosam 💝</button>

    <div id="secret"></div>
  </div>

  <script>
    function showRoseLove() {
      document.getElementById("secret").innerText =
        "This Rose is for you nana 💖 because you are special to me 🌹";

      for (let i = 0; i <25; i++) {
        let rose = document.createElement("div");
        rose.className = "rose";
        rose.innerText = "🌹";
        rose.style.left = Math.random() * 100 + "vw";
        rose.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(rose);

        setTimeout(() => rose.remove(), 6000);
      }
    }
  </script>

</body>
</html>
